# PR 검사를 실행하고, 성공한 실행만 커밋에 묶인 Codex 리뷰 요청을 발행한다.
name: agent-review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAX_ROUNDS: ${{ vars.AGENT_MAX_ROUNDS || '3' }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  gate:
    if: github.event.pull_request.base.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      go: ${{ steps.g.outputs.go }}
      task: ${{ steps.g.outputs.task }}
      issue: ${{ steps.g.outputs.issue }}
      round: ${{ steps.g.outputs.round }}
      owner: ${{ steps.g.outputs.owner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EXECUTOR: ${{ vars.AGENT_EXECUTOR || 'local' }}
          ALLOWED: ${{ vars.AGENT_PR_AUTHORS || format('chatgpt-codex-connector[bot],{0}', github.repository_owner) }}
        run: |
          set -euo pipefail
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          R="repos/$GITHUB_REPOSITORY"

          task=$(sed -nE 's/^((T[0-9]+[A-Z]?|R[0-9]+)): .*/\1/p' <<<"$TITLE")
          if [ -z "$task" ]; then out go false; exit 0; fi
          if ! tr ',' '\n' <<<"$ALLOWED" | grep -qxF "$AUTHOR"; then out go false; exit 0; fi

          # 자동 작업 이슈와 develop의 작업표로 담당을 결정한다.
          case "$task" in
            R*) owner=claude; label=refactor-task ;;
            *)
              label=agent-task
              owner=$(node .github/agent/tasks.mjs get "$task" 담당)
              state=$(node .github/agent/tasks.mjs get "$task" 상태)
              if [[ "$state" != 진행중 && "$state" != 리뷰 ]]; then out go false; exit 0; fi
              ;;
          esac
          if [[ "$owner" != gpt && "$owner" != claude ]]; then out go false; exit 0; fi
          issue=$(gh issue list --state open --label "$label" --json number,title --jq "[.[] | select(.title | startswith(\"$task:\"))] | if length == 1 then .[0].number else empty end")
          if [ -z "$issue" ]; then echo "::notice::진행 중인 작업 이슈를 하나로 확인할 수 없음"; out go false; exit 0; fi
          out task "$task"; out issue "$issue"; out owner "$owner"

          files=$(gh api --paginate "$R/pulls/$PR/files" --jq '.[].filename')
          blocked=$(grep -E '^(\.github/|\.claude/|AGENTS\.md$|CLAUDE\.md$|docs/requirements\.md$|docs/tasks\.md$|scripts/agent/)' <<<"$files" || true)
          if [ -n "$blocked" ]; then
            gh pr edit "$PR" --add-label needs-human
            printf '보호된 파일을 수정해서 사람이 확인해야 합니다.\n\n```\n%s\n```\n' "$blocked" > "$RUNNER_TEMP/c.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/c.md"
            out go false; exit 0
          fi

          # 동일 작업의 후속 cloud PR만 이전 PR을 대체한다. 게이트를 통과한 뒤에 처리한다.
          if [ "$owner" = gpt ] && [ "$EXECUTOR" = cloud ]; then
            for old in $(gh pr list --state open --base develop --json number,title,author --jq ".[] | select(.number != $PR and .author.login == \"$AUTHOR\") | select(.title | startswith(\"$task: \")) | .number"); do
              gh pr close "$old" --comment "#$PR 로 대체되어 닫습니다."
            done
          fi

          n=$(gh api --paginate "$R/issues/$issue/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -c '<!-- agent-review -->' || true)
          out round "$((n + 1))"
          out go true

  test:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    outputs:
      passed: ${{ steps.t.outputs.passed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - id: t
        name: Required checks
        working-directory: candidate
        run: |
          set -euo pipefail
          code=0
          env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY \
            bash ../control/.github/agent/check-required.sh --e2e > "$RUNNER_TEMP/test.log" 2>&1 || code=$?
          # The log is candidate output, so prevent it from emitting Actions workflow commands.
          stop_token=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$stop_token"
          tail -n 200 "$RUNNER_TEMP/test.log"
          echo "::$stop_token::"
          tail -n 150 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/test-tail.log"
          if [ "$code" -eq 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: ${{ runner.temp }}/test-tail.log
          overwrite: true
          retention-days: 7

  review:
    needs: [gate, test]
    if: needs.test.result == 'success' && needs.test.outputs.passed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Claude starts in the trusted checkout. The proposed files are read as data.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: review-input/pr
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: test-log
          path: review-input
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - id: pick
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TASK: ${{ needs.gate.outputs.task }}
          OVERRIDE: ${{ vars.CLAUDE_MODEL }}
        run: |
          set -euo pipefail
          git -C review-input/pr diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > review-input/changes.diff
          printf '%s\n' "$BODY" > review-input/pr-body.md
          echo "model=${OVERRIDE:-$(node .github/agent/model-for.mjs claude "$TASK")}" >> "$GITHUB_OUTPUT"
          echo "effort=$(node .github/agent/model-for.mjs claude-effort "$TASK")" >> "$GITHUB_OUTPUT"
          echo "schema=$(jq -c . .github/agent/review-schema.json)" >> "$GITHUB_OUTPUT"
          jq -Rrs '"review_guide=" + tojson' .github/agent/prompts/review.md >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@v1
        with: &review_invocation
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            PR #${{ github.event.pull_request.number }}의 작업 ${{ needs.gate.outputs.task }}에 대해 Claude ${{ needs.gate.outputs.owner == 'claude' && '자체' || '교차' }} 리뷰를 수행한다.
            구현 세션과 분리된 리뷰다. 구현자의 판단을 그대로 받아들이지 말고 같은 커밋의 변경과 검사 근거로 판정하라.
            기준 문서와 리뷰 지침은 현재 폴더의 develop 버전을 읽어라. 변경 diff는 review-input/changes.diff,
            후보 코드와 테스트는 review-input/pr/, 작성자의 설명은 review-input/pr-body.md에 있다.
            같은 커밋의 Actions 필수 검사가 통과했다. 실제 검사 로그는 review-input/test-tail.log에 있다.
            ${{ fromJSON(steps.pick.outputs.review_guide) }}
          claude_args: >-
            --max-turns 40 --tools "Read,Grep,Glob" --disallowedTools "Bash,Edit,Write,NotebookEdit,Agent,Task"
            --json-schema '${{ steps.pick.outputs.schema }}'
            ${{ steps.pick.outputs.model && format('--model {0}', steps.pick.outputs.model) || '' }}
            ${{ steps.pick.outputs.effort && format('--effort {0}', steps.pick.outputs.effort) || '' }}
      - name: Validate Claude review
        id: validate_review
        continue-on-error: true
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: &validate_review |
          candidate=$(mktemp "$RUNNER_TEMP/claude-review.XXXXXX")
          printf '%s' "$RESULT" > "$candidate"
          node .github/agent/review-record.mjs review "$candidate" >/dev/null
          mv "$candidate" "$RUNNER_TEMP/claude-review.json"
      - name: Repeat the review once if its record is invalid
        id: retry_claude
        if: steps.validate_review.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with: *review_invocation
      - name: Validate repeated Claude review
        if: steps.validate_review.outcome == 'failure'
        env:
          RESULT: ${{ steps.retry_claude.outputs.structured_output }}
        run: *validate_review
      - uses: actions/upload-artifact@v4
        with:
          name: review-json
          path: ${{ runner.temp }}/claude-review.json
          overwrite: true
          retention-days: 7

  decide:
    needs: [gate, test, review]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-log
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: review-json
          path: ${{ runner.temp }}/review
      - id: request
        env:
          TASK: ${{ needs.gate.outputs.task }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          R_TEST: ${{ needs.test.result }}
          R_REVIEW: ${{ needs.review.result }}
          PASSED: ${{ needs.test.outputs.passed }}
          OWNER: ${{ needs.gate.outputs.owner }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$R_TEST" != success || "$PASSED" != true || "$R_REVIEW" != success ]]; then exit 0; fi
          claude=$(node .github/agent/review-record.mjs review "$RUNNER_TEMP/review/claude-review.json")
          jq -n --argjson pr "$PR" --argjson issue "$ISSUE" --argjson run "$GITHUB_RUN_ID" \
            --argjson attempt "$GITHUB_RUN_ATTEMPT" --arg head "$HEAD_SHA" --arg task "$TASK" \
            --arg owner "$OWNER" --argjson claude "$claude" \
            '{ $pr, $issue, $run, $attempt, $head, $task, $owner, $claude, base: "develop", tests: "passed" }' \
            > "$RUNNER_TEMP/request.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.request.outputs.ready == 'true'
        with:
          name: agent-review-pr-${{ env.PR }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/request.json
          overwrite: true
          retention-days: 14
      - if: steps.request.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [ "$(gh pr view "$PR" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA" ] || exit 0
          gh label create needs-codex-review --color 1d76db --description "Codex 리뷰 대기" --force >/dev/null
          gh pr comment "$PR" --body "커밋 \`$HEAD_SHA\`의 필수 검사 통과. Codex 리뷰 대기 중입니다. 실행 #$GITHUB_RUN_ID."
          gh pr edit "$PR" --add-label needs-codex-review
      - if: steps.request.outputs.ready != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          USER_PAT: ${{ secrets.USER_PAT }}
          EXECUTOR: ${{ vars.AGENT_EXECUTOR || 'local' }}
          REFACTOR_MODE: ${{ vars.AGENT_REFACTOR || 'on' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TASK: ${{ needs.gate.outputs.task }}
          ISSUE: ${{ needs.gate.outputs.issue }}
          ROUND: ${{ needs.gate.outputs.round }}
          R_TEST: ${{ needs.test.result }}
          R_REVIEW: ${{ needs.review.result }}
          PASSED: ${{ needs.test.outputs.passed }}
          OWNER: ${{ needs.gate.outputs.owner }}
          REVIEWER: Claude
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/agent/decide.sh
