# Mac 리뷰 러너가 Actions에 직접 판정을 제출한다. PR 댓글은 표시용이다.
name: agent-verdict

on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR 번호
        required: true
        type: string
      head:
        description: 리뷰한 PR 커밋
        required: true
        type: string
      review_run:
        description: 테스트와 교차 리뷰를 기록한 agent-review 실행 ID
        required: true
        type: string
      review:
        description: Codex 판정 JSON
        required: true
        type: string

# 같은 PR의 판정을 직렬화한다. 오래된 커밋의 판정은 아래 단계에서 버린다.
concurrency:
  group: agent-verdict-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verdict:
    if: github.ref == 'refs/heads/develop' && github.actor == (vars.AGENT_CODEX_REVIEW_ACTOR || github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ inputs.head }}
      REVIEW_RUN: ${{ inputs.review_run }}
      MAX_ROUNDS: ${{ vars.AGENT_MAX_ROUNDS || '3' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$REVIEW_RUN" =~ ^[1-9][0-9]*$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          R="repos/$GITHUB_REPOSITORY"
          info=$(gh api "$R/pulls/$PR")
          if ! jq -e --arg head "$HEAD_SHA" --arg repo "$GH_REPO" '
            .state == "open" and .draft == false and .base.ref == "develop" and .head.sha == $head
            and .head.repo.full_name == $repo and ([.labels[].name] | index("needs-human") == null)
          ' <<<"$info" >/dev/null; then
            echo "::notice::PR 상태 또는 최신 커밋이 바뀌어 판정하지 않음"
            exit 0
          fi
          workflow=$(gh api "$R/actions/workflows/agent-review.yml" --jq .id)
          run=$(gh api "$R/actions/runs/$REVIEW_RUN")
          attempt=$(jq -er --argjson workflow "$workflow" --argjson pr "$PR" --arg head "$HEAD_SHA" --arg repo "$GH_REPO" '
            select(.workflow_id == $workflow and .event == "pull_request_target" and .conclusion == "success"
              and .head_sha == $head and .head_repository.full_name == $repo
              and any(.pull_requests[]?; .number == $pr and .base.ref == "develop" and .head.sha == $head))
            | .run_attempt
          ' <<<"$run")
          gh api --paginate "$R/actions/runs/$REVIEW_RUN/attempts/$attempt/jobs" --jq '.jobs[] | select(.name == "test") | .conclusion' > "$RUNNER_TEMP/test-conclusion"
          [ "$(cat "$RUNNER_TEMP/test-conclusion")" = success ] || { echo "::error::해당 실행에서 필수 검사의 성공을 확인하지 못함"; exit 1; }
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.go == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.review_run }}
          name: agent-review-pr-${{ inputs.pr }}-${{ inputs.head }}
          path: ${{ runner.temp }}/request
      - id: prepare
        if: steps.source.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ steps.source.outputs.attempt }}
          CODEX_REVIEW: ${{ inputs.review }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/request/request.json"
          printf '%s' "$CODEX_REVIEW" > "$RUNNER_TEMP/codex-review.json"
          request=$(node .github/agent/review-record.mjs request "$file" "$PR" "$HEAD_SHA" "$REVIEW_RUN" "$ATTEMPT")
          node .github/agent/review-record.mjs combine "$file" "$PR" "$HEAD_SHA" "$REVIEW_RUN" "$ATTEMPT" "$RUNNER_TEMP/codex-review.json" > "$RUNNER_TEMP/verdict.json"
          task=$(jq -r .task <<<"$request")
          issue_number=$(jq -r .issue <<<"$request")
          owner=$(jq -r .owner <<<"$request")
          issue=$(gh issue view "$issue_number" --json state,title)
          jq -e --arg task "$task" '.state == "OPEN" and (.title | startswith($task + ":"))' <<<"$issue" >/dev/null
          n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments" --jq '.[] | select(.user.login == "github-actions[bot]") | .body' | grep -c '<!-- agent-review -->' || true)
          reviewer=Codex
          if [ "$owner" = gpt ]; then reviewer="Claude·Codex"; fi
          jq -n --argjson request "$request" --slurpfile codex "$RUNNER_TEMP/codex-review.json" --slurpfile verdict "$RUNNER_TEMP/verdict.json" \
            '{ $request, codex: $codex[0], verdict: $verdict[0] }' > "$RUNNER_TEMP/decision-record.json"
          {
            echo "task=$task"
            echo "issue=$issue_number"
            echo "owner=$owner"
            echo "round=$((n + 1))"
            echo "reviewer=$reviewer"
            echo "passed=$(jq -r '.tests == "passed"' <<<"$request")"
            echo "test=$(cat "$RUNNER_TEMP/test-conclusion")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.go == 'true'
        with:
          name: decision-record
          path: ${{ runner.temp }}/decision-record.json
          overwrite: true
          retention-days: 14
      - if: steps.source.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          USER_PAT: ${{ secrets.USER_PAT }}
          EXECUTOR: ${{ vars.AGENT_EXECUTOR || 'local' }}
          REFACTOR_MODE: ${{ vars.AGENT_REFACTOR || 'on' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TASK: ${{ steps.prepare.outputs.task }}
          ISSUE: ${{ steps.prepare.outputs.issue }}
          OWNER: ${{ steps.prepare.outputs.owner }}
          ROUND: ${{ steps.prepare.outputs.round }}
          REVIEWER: ${{ steps.prepare.outputs.reviewer }}
          PASSED: ${{ steps.prepare.outputs.passed }}
          R_TEST: ${{ steps.prepare.outputs.test }}
          R_REVIEW: success
        run: |
          set -euo pipefail
          REVIEW_JSON=$(cat "$RUNNER_TEMP/verdict.json") bash .github/agent/decide.sh
