# 재개: 사람이 agent-paused 이슈를 닫으면, 그 이슈가 멈춘 작업을 자동으로 다시 실행한다.
#   <!-- resume:claude issue=N pr=M --> → 같은 작업을 다시 실행. 이전 규칙의 PR은 먼저 양쪽 리뷰를 요청
#   <!-- resume:review pr=M -->         → 같은 입력의 리뷰 검증 실패는 원래 실행에서 재시도
# Mac 러너(Codex)는 이슈가 닫히면 다음 실행에서 스스로 재개하므로 표시가 없다.
# 다른 agent-paused 이슈가 아직 열려 있으면 재개하지 않는다.
name: agent-resume

on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  resume:
    if: contains(github.event.issue.labels.*.name, 'agent-paused') && contains(github.event.issue.body, '<!-- resume:')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # statusCheckRollup은 커밋 정보라 contents 읽기가 필요하다(작업 권한이 상위 기본값을 덮어쓴다)
      contents: read
      checks: read
      statuses: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          USER_PAT: ${{ secrets.USER_PAT }}
          BODY: ${{ github.event.issue.body }}
          CLOSED: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          open=$(gh issue list --label agent-paused --state open --json number --jq length)
          if [ "$open" != 0 ]; then
            gh issue comment "$CLOSED" --body "다른 일시중단 이슈가 아직 열려 있어 자동 재개하지 않았습니다. 모두 닫으면 마지막에 닫은 이슈의 작업이 재개됩니다."
            exit 0
          fi
          marker=$(grep -oE '<!-- resume:[a-z]+[^>]*-->' <<<"$BODY" | head -1)
          kind=$(sed -E 's/<!-- resume:([a-z]+).*/\1/' <<<"$marker")
          issue=$(grep -oE 'issue=[0-9]+' <<<"$marker" | cut -d= -f2 || true)
          pr=$(grep -oE 'pr=[0-9]+' <<<"$marker" | cut -d= -f2 || true)
          pr_open() { [ -n "$1" ] && [ "$(gh pr view "$1" --json state --jq .state)" = OPEN ]; }

          restart_review() {
            if [ -z "$USER_PAT" ]; then echo "::error::USER_PAT 시크릿이 없음"; return 1; fi
            # Actions 토큰으로 닫고 열면 다른 워크플로가 실행되지 않으므로 사용자 토큰을 쓴다
            GH_TOKEN="$USER_PAT" gh pr close "$pr" >/dev/null
            GH_TOKEN="$USER_PAT" gh pr reopen "$pr" >/dev/null
            gh issue comment "$CLOSED" --body "재개: PR #$pr 의 테스트와 양쪽 리뷰를 다시 요청했습니다."
          }

          case "$kind" in
            claude)
              if [ -z "$issue" ] || [ "$(gh issue view "$issue" --json state --jq .state)" != OPEN ]; then
                gh issue comment "$CLOSED" --body "작업 이슈가 이미 닫혀 있어 재개할 작업이 없습니다."; exit 0
              fi
              if pr_open "$pr"; then
                legacy=$(gh pr view "$pr" --json statusCheckRollup --jq '
                  [.statusCheckRollup[] | select(.workflowName == "agent-review")] as $jobs
                  | any($jobs[]; .name == "test" and .conclusion == "SUCCESS")
                    and ([$jobs[] | select(.name == "review") | [.status, .conclusion]] == [["COMPLETED", "SKIPPED"]])')
                if [ "$legacy" = true ]; then
                  restart_review
                else
                  gh workflow run agent-claude.yml --ref develop -f issue="$issue" -f pr="$pr"
                  gh issue comment "$CLOSED" --body "재개: Claude 작업(이슈 #$issue, PR #$pr)을 다시 실행했습니다."
                fi
              else
                gh workflow run agent-claude.yml --ref develop -f issue="$issue"
                gh issue comment "$CLOSED" --body "재개: Claude 작업(이슈 #$issue)을 다시 실행했습니다."
              fi
              ;;
            review)
              if ! pr_open "$pr"; then gh issue comment "$CLOSED" --body "PR이 열려 있지 않아 재개할 리뷰가 없습니다."; exit 0; fi
              action=$(node .github/agent/resume-review.mjs "$pr")
              case "$action" in
                reopen) restart_review ;;
                rerun) gh issue comment "$CLOSED" --body "재개: PR #$pr 의 실패했던 동일 실행에서 필수 검사와 리뷰 전체를 다시 요청했습니다." ;;
                published|running) gh issue comment "$CLOSED" --body "재개: PR #$pr 의 기존 리뷰 실행을 이어갑니다 ($action)." ;;
                fresh-head) gh issue comment "$CLOSED" --body "PR #$pr 의 기존 실패는 현재 입력으로 재실행할 수 없습니다. 새 PR HEAD에서 필수 검사와 양쪽 리뷰를 요청해 주세요." ;;
                hold|collision) gh issue comment "$CLOSED" --body "PR #$pr 의 보류 또는 중복 실행을 확인해 주세요 ($action)." ;;
                *) exit 1 ;;
              esac
              ;;
            *) echo "::notice::알 수 없는 재개 표시: $marker"; exit 0 ;;
          esac
          # 비어 있는 담당 자리가 있으면 다음 작업도 시작한다
          gh workflow run agent-start.yml --ref develop
