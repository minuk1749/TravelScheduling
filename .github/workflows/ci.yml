# 사람이 만든 PR과 main/develop 푸시용 CI
# (Codex 앱이 만든 작업 PR은 agent-review도 같은 검사를 한다)
name: ci
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    # The later job queues on GitHub before a hosted runner is allocated.
    concurrency:
      group: product-checks-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.pull_request.base.sha || github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Identify the checkout before running project code
        id: source
        if: github.event_name == 'pull_request' && github.base_ref == 'develop' && github.event.pull_request.head.repo.id == github.event.repository.id && !github.event.pull_request.draft
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$(git rev-parse 'HEAD^{tree}')" == "$(git rev-parse "${PR_HEAD}^{tree}")" ]]; then
            echo 'exact=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check
        run: env -u GITHUB_OUTPUT -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_STEP_SUMMARY bash .github/agent/check-required.sh
      - name: Agent automation regression tests
        run: node --test .github/agent/*.test.mjs
      - name: Common checks passed for PR ${{ github.event.pull_request.number }} base ${{ github.event.pull_request.base.sha }} head ${{ github.event.pull_request.head.sha }}
        if: steps.source.outputs.exact == 'true'
        run: echo 'The checked merge tree equals the candidate tree.'
