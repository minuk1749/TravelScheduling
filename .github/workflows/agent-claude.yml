# Claude 작업: Claude가 담당 작업(T번호, 작업표 담당=claude)이나 리팩터링(R번호)을 수행하고 PR을 올린다.
#
# 실행 시점: agent-start가 담당이 claude인 작업을 시작할 때, 리뷰가 리팩터링을 제안했을 때,
#            Claude PR에 수정 요청이 나왔을 때(모두 자동), 또는 사람이 이슈 번호로 수동 실행.
# PR은 사용자 토큰(USER_PAT)으로 올리고 owner-claude 라벨을 붙인다 → agent-review가 테스트 후 Codex 리뷰를 요청한다.
# Claude 단계에는 USER_PAT을 넘기지 않는다.
name: agent-claude

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "작업 이슈 번호 (제목이 T번호 또는 R번호로 시작)"
        type: string
        required: true
      pr:
        description: "수정 라운드면 해당 PR 번호"
        type: string
        default: ""

concurrency:
  group: agent-claude
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      ISSUE: ${{ inputs.issue }}
      PR: ${{ inputs.pr }}
    steps:
      - id: info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          id=$(grep -oE '^(T[0-9]+[A-Z]?|R[0-9]+)' <<<"$title" || true)
          if [ -z "$id" ]; then echo "::error::이슈 제목이 T번호나 R번호로 시작하지 않음: $title"; exit 1; fi
          out id "$id"
          case "$id" in R*) out kind refactor; suffix=refactor;; *) out kind implement; suffix=claude;; esac
          out title "${title#*: }"
          if [ -n "$PR" ]; then
            out branch "$(gh pr view "$PR" --json headRefName --jq .headRefName)"
            n=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("<!-- agent-feedback"))] | length')
            out round "$((n + 1))"
          else
            out branch "$(tr 'A-Z' 'a-z' <<<"$id")-$suffix"
            out round 1
          fi
          gh issue view "$ISSUE" --json body --jq .body > "$RUNNER_TEMP/items.md"
          if [ -n "$PR" ]; then
            gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("<!-- agent-feedback"))] | last | .body // ""' > "$RUNNER_TEMP/feedback.md"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.pr != '' && steps.info.outputs.branch || 'develop' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: develop
          path: .ctl
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Merge develop (fix round)
        id: merge
        if: inputs.pr != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 동시에 진행된 다른 작업을 반영한다. 충돌이 나면 충돌 표시를 남겨 Claude가 해결한다
          if git merge -q --no-edit origin/develop; then echo "conflict=false" >> "$GITHUB_OUTPUT"; else echo "conflict=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          printf '.ctl/\n.claude-task.md\n.review-tmp/\n' >> .git/info/exclude

      - id: prompt
        env:
          ID: ${{ steps.info.outputs.id }}
          TITLE: ${{ steps.info.outputs.title }}
          ROUND: ${{ steps.info.outputs.round }}
          KIND: ${{ steps.info.outputs.kind }}
          CONFLICT: ${{ steps.merge.outputs.conflict || 'false' }}
        run: |
          set -euo pipefail
          if [ "$KIND" = refactor ]; then tpl=refactor.md; head="리팩터링 항목"; mk=claude-refactor; else tpl=claude-implement.md; head="작업 지시 (이슈 본문)"; mk=claude-implement; fi
          sed -e "s/{{ID}}/$ID/g" -e "s/{{ROUND}}/$ROUND/g" ".ctl/.github/agent/prompts/$tpl" | awk -v t="$TITLE" '{gsub(/\{\{TITLE\}\}/, t)}1' > .claude-task.md
          { echo; echo "## $head"; echo; cat "$RUNNER_TEMP/items.md"; } >> .claude-task.md
          if [ "$CONFLICT" = true ]; then
            { echo; echo "## develop 병합 충돌"; echo; echo "develop을 이 브랜치에 병합했고 충돌이 있다. 충돌 표시(<<<<<<<, =======, >>>>>>>)가 있는 파일을 먼저 해결하라(양쪽 변경의 의도를 모두 유지)."; } >> .claude-task.md
          fi
          if [ -s "$RUNNER_TEMP/feedback.md" ]; then
            { echo; echo "## 직전 리뷰 피드백 (이번 라운드에서 해결할 것)"; echo; cat "$RUNNER_TEMP/feedback.md"; } >> .claude-task.md
          fi
          echo "model=$(node .ctl/.github/agent/model-for.mjs "$mk" "$ID" .ctl/.github/agent/models.json)" >> "$GITHUB_OUTPUT"
          echo "effort=$(node .ctl/.github/agent/model-for.mjs claude-effort "$ID" .ctl/.github/agent/models.json)" >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # 이 워크플로는 agent-start·판정 단계(GitHub Actions 봇)가 실행한다. 사람이 아니어도 실행하도록 이 봇만 허용
          allowed_bots: "github-actions[bot]"
          prompt: |
            저장소 ${{ github.repository }}의 작업 ${{ steps.info.outputs.id }} 이다. `.claude-task.md`를 읽고 그 지시를 따르라.
          claude_args: >-
            --model ${{ steps.prompt.outputs.model }}
            ${{ steps.prompt.outputs.effort && format('--effort {0}', steps.prompt.outputs.effort) || '' }}
            --max-turns 400
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git mv:*),Bash(git add:*),Bash(git rm:*)"
            --disallowedTools "NotebookEdit"

      - name: Commit, push and open PR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.USER_PAT }}
          GH_REPO: ${{ github.repository }}
          ID: ${{ steps.info.outputs.id }}
          TITLE: ${{ steps.info.outputs.title }}
          BRANCH: ${{ steps.info.outputs.branch }}
          ROUND: ${{ steps.info.outputs.round }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::USER_PAT 시크릿이 없음"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$PR" ]; then git switch -q -C "$BRANCH"; fi
          git add -A
          # 보호 파일은 develop의 내용과 같아야 한다(develop 병합으로 들어온 변경은 유지)
          for f in $(git diff --cached --name-only | grep -E '^(\.github/|AGENTS\.md$|CLAUDE\.md$|docs/requirements\.md$|docs/tasks\.md$|scripts/agent/)' || true); do
            if git diff --cached --quiet origin/develop -- "$f"; then continue; fi
            if git cat-file -e "origin/develop:$f" 2>/dev/null; then git restore --staged --worktree --source=origin/develop -- "$f"; else git rm -q --cached -f -- "$f"; fi
          done
          if git diff --cached --quiet && [ ! -f .git/MERGE_HEAD ] && { [ -z "$PR" ] || [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$BRANCH")" ]; }; then
            gh issue comment "$ISSUE" --body "Claude가 변경 없이 종료했습니다(라운드 $ROUND). 사람이 확인해 주세요."
            gh issue edit "$ISSUE" --add-label needs-human
            exit 0
          fi
          if ! git diff --cached --quiet || [ -f .git/MERGE_HEAD ]; then
            git commit -q -m "$ID: $TITLE (round $ROUND)" -m "Claude 작업, agent-claude 자동 커밋"
          fi

          # Claude 최종 메시지 → PR 설명/댓글
          msg=""
          if [ -n "${EXEC_FILE:-}" ] && [ -f "$EXEC_FILE" ]; then
            msg=$(jq -r 'if type=="array" then (map(select(.type=="result")) | last | .result // "") else (.result // "") end' "$EXEC_FILE" 2>/dev/null || true)
          fi
          printf '%s\n\n---\n작업 이슈: #%s · 구현: Claude · 리뷰: Codex\n' "${msg:-(최종 메시지 없음)}" "$ISSUE" > "$RUNNER_TEMP/body.md"

          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          # 강제 푸시는 쓰지 않는다. 새 작업인데 같은 이름의 브랜치가 이미 있으면(이전 실패 흔적) 새 이름을 쓴다
          if [ -z "$PR" ] && git ls-remote --exit-code --heads "$remote" "$BRANCH" >/dev/null 2>&1; then
            BRANCH="$BRANCH-$GITHUB_RUN_NUMBER"
            git branch -q -m "$BRANCH"
          fi
          git push -q "$remote" "HEAD:refs/heads/$BRANCH"
          if [ -z "$PR" ]; then
            gh label create owner-claude --color fbca04 --description "Claude가 구현한 PR (Codex가 리뷰)" --force >/dev/null
            gh pr create --base develop --head "$BRANCH" --title "$ID: $TITLE" --label owner-claude --body-file "$RUNNER_TEMP/body.md"
          else
            { echo "**Claude 수정 (라운드 $ROUND)**"; echo; cat "$RUNNER_TEMP/body.md"; } | gh pr comment "$PR" --body-file -
            # PR 설명도 최신 보고로 바꾼다. 리뷰어는 PR 설명을 작성자의 주장으로 읽기 때문에 처음 설명이 남아 있으면 실제와 어긋난다
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md" >/dev/null
          fi

      - name: Show Claude failure reason
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # 실패 원인(사용 한도, API 오류 등)을 로그에서 볼 수 있도록 마지막 결과와 메시지 일부만 출력한다
          [ -f "$EXEC_FILE" ] || exit 0
          jq -r 'if type=="array" then . else [.] end
                 | (map(select(.type=="result")) | last | {subtype, is_error, num_turns, result: ((.result // "") | tostring | .[0:1500])}),
                   (map(select(.type=="assistant")) | last | .message.content // [] | map(select(.type=="text") | .text) | join("\n") | .[0:1500])' "$EXEC_FILE" || true
      - name: Pause on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create agent-paused --color b60205 --description "자동 루프 일시중단" --force >/dev/null
          printf 'Claude 작업(이슈 #%s)이 실패해 자동 루프를 멈췄습니다.\n\n- 실행 기록: %s\n\nClaude 구독 한도 소진, 토큰 만료, 일시적 장애일 수 있습니다. **원인을 해결한 뒤 이 이슈를 닫으면 같은 Claude 작업이 자동으로 다시 실행됩니다.**\n\n<!-- resume:claude issue=%s pr=%s -->\n' "$ISSUE" "$RUN_URL" "$ISSUE" "$PR" > "$RUNNER_TEMP/p.md"
          gh issue create --title "자동 루프 일시중단: Claude 작업 #$ISSUE" --label agent-paused --body-file "$RUNNER_TEMP/p.md"
