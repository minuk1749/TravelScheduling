# Claude 구현과 PR 게시. 구현·검증·게시 잡은 별도 러너에서 실행한다.
# 검증한 커밋만 USER_PAT로 게시한다. 중단 시에는 같은 작업·PR·원래 HEAD에 묶인 WIP를 보관한다.
name: agent-claude

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "작업 이슈 번호 (제목이 T번호 또는 R번호로 시작)"
        type: string
        required: true
      pr:
        description: "수정 라운드면 해당 PR 번호"
        type: string
        default: ""

concurrency:
  group: agent-claude
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  claude:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # 최대 400턴(xhigh)을 마칠 수 있도록 여유를 둔다
    timeout-minutes: 150
    outputs:
      wip: ${{ steps.upload.outcome == 'success' && (steps.candidate.outputs.wip || steps.bundle.outputs.wip) || '' }}
      attempt: ${{ github.run_attempt }}
    permissions:
      # check-pr.mjs가 읽는 statusCheckRollup의 workflowName(checkSuite.workflowRun)은 actions 읽기 권한이 필요하다
      actions: read
      checks: read
      statuses: read
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app
      ISSUE: ${{ inputs.issue }}
      PR: ${{ inputs.pr }}
    steps:
      - id: info
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          out() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          [[ $ISSUE =~ ^[0-9]+$ && ( -z $PR || $PR =~ ^[0-9]+$ ) ]] || exit 1
          title=$(gh issue view "$ISSUE" --json title --jq .title)
          id=$(grep -oE '^(T[0-9]+[A-Z]?|R[0-9]+)' <<<"$title" || true)
          if [ -z "$id" ]; then echo "::error::이슈 제목이 T번호나 R번호로 시작하지 않음: $title"; exit 1; fi
          out id "$id"
          case "$id" in R*) out kind refactor;; *) out kind implement;; esac
          out title "${title#*: }"
          if [ -n "$PR" ]; then
            pr_info=$(gh pr view "$PR" --json headRefOid)
            out head "$(jq -r .headRefOid <<<"$pr_info")"
            n=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("<!-- agent-feedback"))] | length')
            out round "$((n + 1))"
          else
            out round 1
          fi
          gh issue view "$ISSUE" --json body --jq .body > "$RUNNER_TEMP/items.md"
          if [ -n "$PR" ]; then
            gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | contains("<!-- agent-feedback"))] | last | .body // ""' > "$RUNNER_TEMP/feedback.md"
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.info.outputs.head || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ctl
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Verify task before implementation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ID: ${{ steps.info.outputs.id }}
          KIND: ${{ steps.info.outputs.kind }}
          HEAD_SHA: ${{ steps.info.outputs.head }}
        run: |
          set -euo pipefail
          if [ "$KIND" = implement ]; then
            table=.ctl/docs/tasks.md
            [ "$(node .ctl/.github/agent/tasks.mjs get "$ID" 담당 --file "$table")" = claude ]
            state=$(node .ctl/.github/agent/tasks.mjs get "$ID" 상태 --file "$table")
            [[ "$state" = 진행중 || "$state" = 리뷰 ]] || exit 1
          fi
          if [ -n "$PR" ]; then node .ctl/.github/agent/check-pr.mjs "$GH_REPO" "$PR" "$HEAD_SHA" claude; fi
      - name: Restore interrupted work
        id: resume
        env:
          ID: ${{ steps.info.outputs.id }}
          HEAD_SHA: ${{ steps.info.outputs.head }}
        run: |
          set -euo pipefail
          # 작업 PR/복구 후보가 아닌 이 워크플로를 정의한 커밋의 코드를 실행한다.
          git show "$GITHUB_SHA:.github/agent/claude-wip.sh" | bash -s -- restore
      - name: Merge develop (fix round or resumed work)
        id: merge
        if: inputs.pr != '' || steps.resume.outputs.wip != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 동시에 진행된 다른 작업을 반영한다. 충돌이 나면 충돌 표시를 남겨 Claude가 해결한다
          if git merge -q --no-ff --no-commit "$GITHUB_SHA"; then echo "conflict=false" >> "$GITHUB_OUTPUT"; else echo "conflict=true" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          printf '.ctl/\n.claude-task.md\n.review-tmp/\n' >> .git/info/exclude

      - id: prompt
        env:
          ID: ${{ steps.info.outputs.id }}
          TITLE: ${{ steps.info.outputs.title }}
          ROUND: ${{ steps.info.outputs.round }}
          KIND: ${{ steps.info.outputs.kind }}
          CONFLICT: ${{ steps.merge.outputs.conflict || 'false' }}
          WIP: ${{ steps.resume.outputs.wip }}
        run: |
          set -euo pipefail
          if [ "$KIND" = refactor ]; then tpl=refactor.md; head="리팩터링 항목"; mk=claude-refactor; else tpl=claude-implement.md; head="작업 지시 (이슈 본문)"; mk=claude-implement; fi
          sed -e "s/{{ID}}/$ID/g" -e "s/{{ROUND}}/$ROUND/g" ".ctl/.github/agent/prompts/$tpl" | awk -v t="$TITLE" '{gsub(/\{\{TITLE\}\}/, t)}1' > .claude-task.md
          { echo; echo "## $head"; echo; cat "$RUNNER_TEMP/items.md"; } >> .claude-task.md
          if [ -n "$WIP" ]; then
            { echo; echo "## 이전 실행에서 이어서"; echo; echo "이전 실행이 끝나기 전에 중단되어(사용 한도, 최대 턴 등) 그때까지의 변경을 커밋해 두었고, 지금 그 커밋 위에서 시작한다(\`git log origin/develop..HEAD\`, \`git diff origin/develop\`로 확인). 처음부터 다시 만들지 말고 이미 한 작업을 확인해 남은 부분을 마무리하라. 중단 직전 상태라 미완성이거나 검사가 깨져 있을 수 있으니 lint·typecheck·build·test를 다시 돌려 확인하라."; } >> .claude-task.md
          fi
          if [ "$CONFLICT" = true ]; then
            { echo; echo "## develop 병합 충돌"; echo; echo "develop을 이 브랜치에 병합했고 충돌이 있다. 충돌 표시(<<<<<<<, =======, >>>>>>>)가 있는 파일을 먼저 해결하라(양쪽 변경의 의도를 모두 유지)."; } >> .claude-task.md
          fi
          if [ -s "$RUNNER_TEMP/feedback.md" ]; then
            { echo; echo "## 직전 리뷰 피드백 (이번 라운드에서 해결할 것)"; echo; cat "$RUNNER_TEMP/feedback.md"; } >> .claude-task.md
          fi
          echo "model=$(node .ctl/.github/agent/model-for.mjs "$mk" "$ID" .ctl/.github/agent/models.json)" >> "$GITHUB_OUTPUT"
          echo "effort=$(node .ctl/.github/agent/model-for.mjs claude-effort "$ID" .ctl/.github/agent/models.json)" >> "$GITHUB_OUTPUT"

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # 이 워크플로는 agent-start·판정 단계(GitHub Actions 봇)가 실행한다. 사람이 아니어도 실행하도록 이 봇만 허용
          allowed_bots: "github-actions[bot]"
          prompt: |
            저장소 ${{ github.repository }}의 작업 ${{ steps.info.outputs.id }} 이다. `.claude-task.md`를 읽고 그 지시를 따르라.
          claude_args: >-
            --model ${{ steps.prompt.outputs.model }}
            ${{ steps.prompt.outputs.effort && format('--effort {0}', steps.prompt.outputs.effort) || '' }}
            --max-turns 400
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git mv:*),Bash(git add:*),Bash(git rm:*)"
            --disallowedTools "NotebookEdit"

      - name: Prepare candidate
        id: candidate
        env:
          ID: ${{ steps.info.outputs.id }}
          BASE_SHA: ${{ steps.resume.outputs.base }}
          TITLE: ${{ steps.info.outputs.title }}
          ROUND: ${{ steps.info.outputs.round }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/agent/claude-wip.sh" | bash -s -- candidate

      - name: Show Claude failure reason
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          # 실패 원인(사용 한도, API 오류 등)을 로그에서 볼 수 있도록 마지막 결과와 메시지 일부만 출력한다
          [ -f "$EXEC_FILE" ] || exit 0
          jq -r 'if type=="array" then . else [.] end
                 | (map(select(.type=="result")) | last | {subtype, is_error, num_turns, result: ((.result // "") | tostring | .[0:1500])}),
                   (map(select(.type=="assistant")) | last | .message.content // [] | map(select(.type=="text") | .text) | join("\n") | .[0:1500])' "$EXEC_FILE" || true
      - name: Prepare interrupted candidate
        id: bundle
        if: (failure() || cancelled()) && steps.claude.outcome != '' && steps.claude.outcome != 'skipped'
        env:
          ID: ${{ steps.info.outputs.id }}
          BASE_SHA: ${{ steps.resume.outputs.base }}
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:.github/agent/claude-wip.sh" | bash -s -- bundle
      - uses: actions/upload-artifact@v4
        id: upload
        if: always() && (steps.candidate.outputs.wip != '' || steps.bundle.outputs.wip != '')
        with:
          name: claude-wip-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/claude-wip.bundle
            ${{ runner.temp }}/claude-report.md
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: claude
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: claude-wip-${{ needs.claude.outputs.attempt }}
          path: ${{ runner.temp }}/archive
      - name: Verify bundled candidate
        id: verify
        env:
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          WIP: ${{ needs.claude.outputs.wip }}
          ATTEMPT: ${{ needs.claude.outputs.attempt }}
          PG_SERVICE: ${{ job.services.postgres.id }}
        run: |
          bash control/.github/agent/claude-candidate.sh verify

  publish:
    needs: [claude, verify]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      statuses: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: control
      - uses: actions/download-artifact@v4
        with:
          name: claude-wip-${{ needs.claude.outputs.attempt }}
          path: ${{ runner.temp }}/archive
      - name: Publish verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          USER_PAT: ${{ secrets.USER_PAT }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          WIP: ${{ needs.claude.outputs.wip }}
          ATTEMPT: ${{ needs.claude.outputs.attempt }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          bash control/.github/agent/claude-candidate.sh publish

  interrupted:
    needs: [claude, verify, publish]
    if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/agent-claude-interrupted.yml
    with:
      issue: ${{ inputs.issue }}
      pr: ${{ inputs.pr }}
      wip: ${{ needs.claude.outputs.wip }}
      attempt: ${{ needs.claude.outputs.attempt }}
