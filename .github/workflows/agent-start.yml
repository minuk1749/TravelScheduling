# 루프 1단계: 다음 작업을 골라 작업 이슈를 만든다.
#
# 실행 시점: agent-review가 PR을 머지하거나 보류한 직후(자동), 또는 Actions 화면에서 수동 실행.
# 작업표의 담당이 claude면 agent-claude(Claude)가 구현하고, 아니면 Codex가 구현한다. Codex 쪽 주체는 AGENT_EXECUTOR로 고른다.
#   local(기본): Mac 러너가 이슈를 읽어 Codex CLI로 구현하고 PR을 올린다.
#   cloud: 이슈에 @codex를 요청하고, 사람이 Codex 화면에서 PR 생성 버튼을 누른다.
name: agent-start

on:
  workflow_dispatch:

concurrency:
  group: agent-start
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - env:
          GH_TOKEN: ${{ github.token }}
          USER_PAT: ${{ secrets.USER_PAT }}
          EXECUTOR: ${{ vars.AGENT_EXECUTOR || 'local' }}
        run: |
          set -euo pipefail
          T="node .github/agent/tasks.mjs"

          if [ "$EXECUTOR" = cloud ] && [ -z "$USER_PAT" ]; then echo "::error::USER_PAT 시크릿이 없음"; exit 1; fi
          if [ "$(gh issue list --label agent-paused --state open --json number --jq length)" != 0 ]; then
            echo "::notice::일시중단 상태(agent-paused 이슈가 열려 있음)"; exit 0
          fi
          if [ "$(gh issue list --label refactor-task --state open --json number --jq length)" != 0 ]; then
            echo "::notice::리팩터링 작업이 진행 중이라 새 작업을 시작하지 않음"; exit 0
          fi
          if [ "$(gh issue list --label agent-task --state open --json number --jq length)" != 0 ]; then
            echo "::notice::진행 중인 작업 이슈가 있어 새 작업을 시작하지 않음"; exit 0
          fi

          json=$($T next)
          if [ "$json" = "{}" ]; then echo "::notice::자동으로 진행할 수 있는 작업이 없음"; exit 0; fi
          id=$(jq -r .id <<<"$json"); title=$(jq -r .title <<<"$json")

          gh label create agent-task --color 5319e7 --description "Codex에 요청한 작업" --force >/dev/null
          gh label create needs-human --color d93f0b --description "사람 확인 필요" --force >/dev/null
          gh label create agent-paused --color b60205 --description "자동 루프 일시중단" --force >/dev/null

          # 담당을 먼저 정하고, Claude 담당이면 이슈를 만들 때부터 owner-claude 라벨을 붙인다(러너가 집어 가지 않도록)
          owner=$($T get "$id" 담당); [ "$owner" = claude ] || owner=gpt
          labels="agent-task"
          if [ "$owner" = claude ]; then
            gh label create owner-claude --color fbca04 --description "Claude가 구현한 PR (Codex가 리뷰)" --force >/dev/null
            labels="agent-task,owner-claude"
          fi
          node .github/agent/prompt.mjs "$id" "$title" > "$RUNNER_TEMP/body.md"
          url=$(gh issue create --title "$id: $title" --label "$labels" --body-file "$RUNNER_TEMP/body.md")
          num="${url##*/}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $T set "$id" "상태=진행중" "담당=$owner" "PR="
          git add docs/tasks.md
          git commit -q -m "$id 시작 (이슈 #$num)"
          git push -q origin develop

          if [ "$owner" = claude ]; then
            gh workflow run agent-claude.yml --ref develop -f issue="$num"
            echo "::notice::$id 시작: 이슈 #$num, 담당 Claude (agent-claude 실행)"
          elif [ "$EXECUTOR" = cloud ]; then
            # Codex 클라우드는 저장소에 연결된 사용자의 댓글에만 반응하므로 사용자 토큰으로 요청한다
            GH_TOKEN="$USER_PAT" gh issue comment "$num" --body "@codex 이 이슈 본문의 지시대로 $id 를 구현하고 develop 브랜치 대상 PR을 준비해 줘. PR 제목은 반드시 \`$id: \`로 시작해야 해."
            echo "::notice::$id 시작: 이슈 #$num. Codex 완료 후 Codex 화면에서 PR 생성 버튼을 눌러 주세요."
          else
            echo "::notice::$id 시작: 이슈 #$num. Mac 러너(scripts/agent/local-runner.sh)가 다음 실행 때 구현한다."
          fi
